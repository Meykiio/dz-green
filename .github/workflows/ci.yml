name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      # Actions pinned to commit SHAs (a moved tag cannot change what runs).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run build

  fire-risk-model:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/fire-risk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
